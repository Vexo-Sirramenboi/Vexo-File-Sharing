<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090e">
<title>Vexo Share</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#06080c;--panel:rgba(14,18,27,.82);--panel2:#111722;--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:#929bad;--accent:#7c9cff;--accent2:#a07cff;--good:#61d69a;--bad:#ff6b7d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;animation:grid 18s linear infinite}@keyframes grid{to{background-position:34px 34px}}
.page{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:28px 18px}.shell{width:min(820px,100%)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}.brand b{font-size:18px}.brand span{display:block;font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:22px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
h1{margin:0;font-size:32px;letter-spacing:-1px}.sub{color:var(--muted);font-size:13px;margin-top:7px}.notice{margin:18px 0;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:12px}.notice.error{color:var(--bad);border-color:rgba(255,107,125,.25)}.notice.success{color:var(--good)}
.files{display:grid;gap:9px}.f{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:rgba(7,10,15,.5)}.icon{width:40px;height:40px;border-radius:10px;background:#121722;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--accent)}.main{flex:1;min-width:0}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:3px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650;cursor:pointer}.btn:hover{border-color:rgba(124,156,255,.5)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#080a10}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}a{color:var(--accent);text-decoration:none}.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.card{padding:18px}.actions{flex-direction:column}.actions .btn,.actions a{width:100%;text-align:center}}
</style>
</head>
<body>
<div class="page"><div class="shell">
<div class="brand"><div class="mark">V</div><div><b>Vexo Share</b><span>Shared files</span></div></div>
<main class="card">
  <div style="text-align:center" id="loading"><div class="spinner"></div><h1 style="font-size:24px">Loading share…</h1><div class="sub">Checking the share with Supabase.</div></div>
  <div id="view" hidden>
    <h1 id="title"></h1><div class="sub" id="sub"></div>
    <div class="notice" id="notice"></div>
    <div class="files" id="files"></div>
    <div class="actions" id="actions"></div>
  </div>
</main>
</div></div>
<script>
const SUPABASE_URL='https://nompblznhrnedcseybkn.supabase.co';
const SUPABASE_KEY='sb_publishable_9d1kCj6KhuLQHe4AhIsEOw_72fnlScq';
const client=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const code=new URLSearchParams(location.search).get('code');
let share=null, files=[];
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1024**2)return (n/1024).toFixed(1)+' KB';if(n<1024**3)return (n/1024**2).toFixed(1)+' MB';return (n/1024**3).toFixed(1)+' GB';}
function showError(message){
  $('#loading').hidden=true; $('#view').hidden=false;
  $('#title').textContent='Share unavailable';
  $('#sub').textContent='';
  $('#notice').className='notice error';
  $('#notice').textContent=message;
  $('#files').innerHTML='';
  $('#actions').innerHTML='<a class="btn" href="index.html">Create a share</a>';
}
function showView(){ $('#loading').hidden=true; $('#view').hidden=false; }
function render(){
  showView();
  const remaining=share.max_downloads==null?'Unlimited downloads':`${Math.max(0,share.max_downloads-share.download_count)} downloads remaining`;
  $('#title').textContent='Files ready to download';
  $('#sub').textContent=`Expires ${new Date(share.expires_at).toLocaleString()} · ${remaining}`;
  const total=files.reduce((a,b)=>a+Number(b.file_size||0),0);
  $('#notice').className='notice';
  $('#notice').textContent=`${files.length} file${files.length===1?'':'s'} · ${fmt(total)}`;
  $('#files').innerHTML=files.map((f,i)=>`<div class="f"><div class="icon">${esc((f.file_name.split('.').pop()||'FILE').slice(0,4).toUpperCase())}</div><div class="main"><div class="name">${esc(f.file_name)}</div><div class="meta">${fmt(f.file_size)}</div></div><button class="btn" data-download="${i}">Download</button></div>`).join('');
  $('#actions').innerHTML=files.length>1?'<button class="btn primary" id="all">Download all</button>':'<a class="btn" href="index.html">Create your own share</a>';
}
async function withTimeout(promise,ms=12000){
  return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Supabase did not respond within 12 seconds. Check your connection and Supabase project status.')),ms))]);
}
async function load(){
  try{
    if(!client) throw new Error('Supabase JavaScript failed to load. Refresh the page or check that the CDN is not blocked.');
    if(!code) throw new Error('This link does not contain a share code.');
    const {data:s,error:e}=await withTimeout(client.from('shares').select('id,share_code,expires_at,max_downloads,download_count').eq('share_code',code).maybeSingle());
    if(e) throw new Error(`Could not read the share: ${e.message}`);
    if(!s) throw new Error('This share does not exist, has expired, or has reached its download limit.');
    share=s;
    const {data:f,error:fe}=await withTimeout(client.from('share_files').select('id,file_name,storage_path,file_size,mime_type').eq('share_id',s.id).order('created_at'));
    if(fe) throw new Error(`Could not read the files: ${fe.message}`);
    files=f||[];
    if(!files.length) throw new Error('This share contains no files.');
    render();
  }catch(err){console.error(err);showError(err?.message||'Something went wrong while loading the share.');}
}
async function downloadFile(i){
  const f=files[i];
  try{
    $('#notice').className='notice'; $('#notice').textContent='Preparing download…';
    const {data:signed,error}=await withTimeout(client.storage.from('vexo-files').createSignedUrl(f.storage_path,120));
    if(error||!signed?.signedUrl) throw new Error(error?.message||'Could not create a download link.');
    const {data:ok,error:rpcError}=await withTimeout(client.rpc('consume_share_download',{p_share_code:code}));
    if(rpcError) throw new Error(rpcError.message);
    if(!ok) throw new Error('This share has reached its download limit or expired.');
    share.download_count++;
    window.location.assign(signed.signedUrl);
  }catch(err){$('#notice').className='notice error';$('#notice').textContent=err?.message||'Download failed.';}
}
$('#files').addEventListener('click',e=>{const b=e.target.closest('[data-download]');if(b)downloadFile(Number(b.dataset.download));});
$('#actions').addEventListener('click',async e=>{if(e.target.id!=='all')return;for(let i=0;i<files.length;i++){await downloadFile(i);if(i<files.length-1)await new Promise(r=>setTimeout(r,400));}});
load();
</script>
</body></html>
